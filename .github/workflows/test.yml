name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # SymPy wheels for the offline exact-engine tests, and CPython SymPy for the corpus check.
      - run: pip download sympy==1.12 mpmath==1.3.0 --no-deps -d tests/.wheels
      - run: pip install sympy==1.12 mpmath==1.3.0
      - name: Corpus is up to date with its generator
        run: python tests/corpus/generate.py && git diff --exit-code tests/corpus/corpus.json
      - run: npm run build
      - run: npm test
